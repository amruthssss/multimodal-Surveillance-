# YOLO Dataset Configuration
# This file maps class IDs to event names
# Copy this if you don't have args.yaml from Kaggle

path: yolo_dataset
train: train/images
val: val/images

nc: 4  # Number of classes

# Class names for the current visual event scope. Gunshot is audio-only.
names:
  0: explosion
  1: fire
  2: smoke
  3: vehicle_accident

# Training configuration (optional reference)
epochs: 100
batch: 16
imgsz: 640
