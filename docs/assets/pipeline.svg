<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" role="img" aria-label="Sentinel Vision pipeline: sources, capture, detection, confirmation, incident, then dashboard, email and SMS" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="n" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f2a"/>
      <stop offset="1" stop-color="#12151d"/>
    </linearGradient>
    <linearGradient id="r" x1="0" x2="1">
      <stop offset="0" stop-color="#ff3b35"/>
      <stop offset="1" stop-color="#ff9a3d"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="270" rx="20" fill="#0d1017"/>

  <!-- links -->
  <g stroke="#ff3b35" stroke-opacity=".35" stroke-width="2" fill="none" stroke-dasharray="6 6">
    <path d="M180 135H220"><animate attributeName="stroke-dashoffset" values="24;0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M370 135H410"><animate attributeName="stroke-dashoffset" values="24;0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M560 135H600"><animate attributeName="stroke-dashoffset" values="24;0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M750 135H790"><animate attributeName="stroke-dashoffset" values="24;0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M940 135C965 135 965 55 990 55"><animate attributeName="stroke-dashoffset" values="24;0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M940 135H990"><animate attributeName="stroke-dashoffset" values="24;0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M940 135C965 135 965 215 990 215"><animate attributeName="stroke-dashoffset" values="24;0" dur="1s" repeatCount="indefinite"/></path>
  </g>

  <!-- travelling pulses -->
  <g fill="#ffb86b" filter="url(#g)">
    <circle r="5"><animateMotion dur="1.6s" repeatCount="indefinite" path="M180 135H220"/></circle>
    <circle r="5"><animateMotion dur="1.6s" begin=".3s" repeatCount="indefinite" path="M370 135H410"/></circle>
    <circle r="5"><animateMotion dur="1.6s" begin=".6s" repeatCount="indefinite" path="M560 135H600"/></circle>
    <circle r="5"><animateMotion dur="1.6s" begin=".9s" repeatCount="indefinite" path="M750 135H790"/></circle>
    <circle r="5" fill="#ff3b35"><animateMotion dur="1.4s" begin="1.2s" repeatCount="indefinite" path="M940 135C965 135 965 55 990 55"/></circle>
    <circle r="5" fill="#ff3b35"><animateMotion dur="1.4s" begin="1.2s" repeatCount="indefinite" path="M940 135H990"/></circle>
    <circle r="5" fill="#ff3b35"><animateMotion dur="1.4s" begin="1.2s" repeatCount="indefinite" path="M940 135C965 135 965 215 990 215"/></circle>
  </g>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- nodes -->
    <g>
      <rect x="30" y="95" width="150" height="80" rx="14" fill="url(#n)" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="105" y="128" font-size="16" font-weight="700" fill="#fff">Sources</text>
      <text x="105" y="150" font-size="12" fill="#9aa3b5">Cam · RTSP · YouTube</text>
      <text x="105" y="165" font-size="12" fill="#9aa3b5">File · Microphone</text>
    </g>
    <g>
      <rect x="220" y="95" width="150" height="80" rx="14" fill="url(#n)" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="295" y="128" font-size="16" font-weight="700" fill="#fff">Capture</text>
      <text x="295" y="152" font-size="12" fill="#9aa3b5">Latest-frame MJPEG</text>
    </g>
    <g>
      <rect x="410" y="95" width="150" height="80" rx="14" fill="url(#n)" stroke="#ff3b35" stroke-opacity=".7">
        <animate attributeName="stroke-opacity" values=".25;.9;.25" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <text x="485" y="128" font-size="16" font-weight="700" fill="#fff">Detect</text>
      <text x="485" y="150" font-size="12" fill="#9aa3b5">YOLO · heuristics</text>
      <text x="485" y="165" font-size="12" fill="#9aa3b5">YAMNet audio</text>
    </g>
    <g>
      <rect x="600" y="95" width="150" height="80" rx="14" fill="url(#n)" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="675" y="128" font-size="16" font-weight="700" fill="#fff">Confirm</text>
      <text x="675" y="152" font-size="12" fill="#9aa3b5">Temporal voting</text>
    </g>
    <g>
      <rect x="790" y="95" width="150" height="80" rx="14" fill="url(#n)" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="865" y="128" font-size="16" font-weight="700" fill="#fff">Incident</text>
      <text x="865" y="152" font-size="12" fill="#9aa3b5">Dedupe + evidence</text>
    </g>

    <!-- outputs -->
    <g>
      <rect x="990" y="25" width="180" height="60" rx="14" fill="#ff3b35" fill-opacity=".14" stroke="#ff3b35"/>
      <text x="1080" y="60" font-size="16" font-weight="700" fill="#fff">Dashboard</text>
    </g>
    <g>
      <rect x="990" y="105" width="180" height="60" rx="14" fill="#ff9a3d" fill-opacity=".14" stroke="#ff9a3d"/>
      <text x="1080" y="130" font-size="16" font-weight="700" fill="#fff">Email + JPEG</text>
      <text x="1080" y="150" font-size="12" fill="#c9b79c">HIGH · CRITICAL</text>
    </g>
    <g>
      <rect x="990" y="185" width="180" height="60" rx="14" fill="#ff9a3d" fill-opacity=".14" stroke="#ff9a3d"/>
      <text x="1080" y="210" font-size="16" font-weight="700" fill="#fff">SMS</text>
      <text x="1080" y="230" font-size="12" fill="#c9b79c">CRITICAL only</text>
    </g>
  </g>
</svg>
